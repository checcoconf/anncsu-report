name: Report ANNCSU

on:
  schedule:
    # Una sola corsa al giorno. Il cron di GitHub è in UTC e non conosce l'ora
    # legale: 01:00 UTC sono le 3 del mattino in Italia d'estate e le 2
    # d'inverno. Con "0 2" sarebbe l'opposto, le 4 d'estate e le 3 d'inverno.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      forza:
        description: "Genera il report anche se i dataset non sono cambiati"
        type: boolean
        default: false
      regioni:
        description: "Codici ANNCSU separati da virgola (solo per prove, es. VALL,MOLI)"
        type: string
        default: ""

concurrency:
  group: report-anncsu
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Guarda se l'ANNCSU ha pubblicato qualcosa di nuovo
        id: controllo
        run: python tools/anncsu_report.py --out report --controlla

      - name: Genera il report
        id: genera
        if: steps.controllo.outputs.cambiato == 'true' || inputs.forza || inputs.regioni != ''
        run: |
          set -o pipefail
          ARGS="--out report --dist dist --readme README.md --lavoro $RUNNER_TEMP/anncsu"
          if [ -n "${{ inputs.regioni }}" ]; then
            ARGS="$ARGS --regioni ${{ inputs.regioni }} --parziale"
          fi
          python tools/anncsu_report.py $ARGS

      - name: Committa il report
        if: steps.genera.outputs.pubblica == 'true'
        run: |
          if [ -z "$(git status --porcelain report data README.md)" ]; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report data README.md
          git commit -m "Report ANNCSU ${{ steps.genera.outputs.mese }}: ${{ steps.genera.outputs.variazioni }} comuni variati [skip ci]"
          # se nel frattempo e' arrivato altro su main, riallineo e riprovo
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Pubblica il dump completo come release
        if: steps.genera.outputs.pubblica == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="report-${{ steps.genera.outputs.mese }}"
          NOTE="dist/note-release.md"
          [ -f "$NOTE" ] || echo "Report ANNCSU ${{ steps.genera.outputs.mese }}." > "$NOTE"

          # le note non vanno allegate come file, sono il testo della release
          ALLEGATI=$(find dist -maxdepth 1 -type f ! -name note-release.md ! -name slack.json)
          if [ -z "$ALLEGATI" ]; then
            echo "::warning::nessun file da allegare, salto la release"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ALLEGATI --clobber
            gh release edit "$TAG" --notes-file "$NOTE"
          else
            gh release create "$TAG" $ALLEGATI \
              --title "Report ANNCSU ${{ steps.genera.outputs.mese }}" \
              --notes-file "$NOTE"
          fi

      - name: Allega gli output anche al run
        if: always() && steps.genera.outputs.pubblica == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: report-anncsu
          path: |
            report/
            dist/
          if-no-files-found: ignore
          retention-days: 90
